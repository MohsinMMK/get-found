# Publishes a GitHub Release with get-found.zip (the skill folder, ready for Claude.ai upload).
# Triggers: bumping "version" in .claude-plugin/plugin.json (or adding release notes) on main,
# pushing a tag vX.Y.Z, or running it manually. The tag is v<version> from plugin.json.
# Release notes come from .github/release-notes/v<version>.md when present.
name: release
on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - ".github/release-notes/**"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Work out the tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else
            TAG="v$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Package skill (top-level folder get-found/, as Claude.ai expects)
        run: cd skills && zip -r ../get-found.zip get-found -x "*/__pycache__/*"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing its get-found.zip"
            gh release upload "$TAG" get-found.zip --clobber
            exit 0
          fi
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$TAG" get-found.zip --target "$GITHUB_SHA" --title "get-found $TAG" "${ARGS[@]}"
